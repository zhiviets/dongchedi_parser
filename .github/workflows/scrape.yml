name: Weekly Dongchedi scrape

# Автозапуск выключен: раздел подержанных машин dongchedi требует входа по SMS.
# Китай собирает «Weekly China (che168) scrape»; этот запуск — только вручную.
on:
  workflow_dispatch:
    inputs:
      total:
        description: "Сколько машин собрать"
        default: "30"

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Одна машина — страница объявления и страница комплектации с паузами
    timeout-minutes: 330
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-ci.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run weekly scraper and push to bn-auto
        env:
          PYTHONIOENCODING: utf-8
          BN_AUTO_URL: ${{ secrets.BN_AUTO_URL }}
          BN_AUTO_IMPORT_TOKEN: ${{ secrets.BN_AUTO_IMPORT_TOKEN }}
          DONGCHEDI_SEARCH_URL: ${{ secrets.DONGCHEDI_SEARCH_URL }}
          # Прокси необязателен: без секретов парсер ходит напрямую
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # По расписанию — 300 машин; при ручном запуске — число из поля
          DONGCHEDI_TOTAL: ${{ inputs.total || '300' }}
        run: |
          python weekly_scraper.py

      # Всегда, не только при ошибке: скриншоты, HTML и сырые ответы сайта —
      # по ним дорабатывается разбор.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dongchedi-debug
          path: |
            debug
            weekly_batch.json
          retention-days: 14
          if-no-files-found: ignore
