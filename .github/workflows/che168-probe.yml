name: Che168 probe

# Разовая проверка che168.com: пускает ли без входа и что есть на страницах.
# Ничего не отправляет на сайт — только сохраняет артефакт «che168-probe».
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Probe che168 (через прокси и напрямую)
        env:
          PYTHONIOENCODING: utf-8
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          CHE168_DIRECT: "1"
        run: python che168_probe.py
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: che168-probe
          path: che168_debug
          retention-days: 14
          if-no-files-found: ignore
