name: Japan probe

# Разовая проверка японских площадок (goo-net-exchange, carsensor): пускают ли
# без капчи и что есть на страницах. Ничего не отправляет на сайт.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Probe Japan sites (напрямую и через прокси)
        env:
          PYTHONIOENCODING: utf-8
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python japan_probe.py
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-probe
          path: japan_debug
          retention-days: 14
          if-no-files-found: ignore
