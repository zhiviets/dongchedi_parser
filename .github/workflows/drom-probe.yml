name: Drom probe

# Разовая проверка каталога drom.ru (мощность по комплектациям): пускает ли
# сервер напрямую и через российский прокси. Ничего не отправляет на сайт.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Probe drom.ru catalog
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python drom_probe.py
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drom-probe
          path: drom_debug
          retention-days: 14
          if-no-files-found: ignore
