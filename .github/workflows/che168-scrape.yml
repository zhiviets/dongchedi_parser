name: Weekly China (che168) scrape

on:
  schedule:
    # Пока каталог не заполнен (6000 машин), прогоны идут друг за другом без остановки: каждый
    # в конце запускает следующий (шаг «Next fill run»); расписание — страховка, если цепочка
    # оборвётся. После заполнения — обновление по вторникам и пятницам (первый прогон дня,
    # порции по 150 с паузой 30 минут), в остальное время прогон сразу заканчивается.
    - cron: "0 3,11,19 * * *"
  workflow_dispatch:
    inputs:
      total:
        description: "Сколько новых машин добавить (0 — само: заполнение до 6000, потом 2 раза в неделю)"
        default: "0"
      minutes:
        description: "Сколько минут обходить марки и модели che168 (для проверки хватит 10)"
        default: "90"

# Один прогон за раз: запуск по расписанию ждёт, пока закончится предыдущий
# (два параллельных прогона — двойная нагрузка на сайт-источник и риск блокировки)
concurrency:
  group: che168-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Обход марок и моделей (до 1,5 ч) + до 1000 машин порциями по 100 с паузой 1–2 минуты
    timeout-minutes: 355
    # Сохранить в репозиторий найденную мощность (кэш Autohome и drom.ru)
    # contents: write — кэш мощности; actions: write — запустить следующий прогон
    permissions:
      contents: write
      actions: write
    steps:
      # Время старта — шаг «Next fill run» по нему отличает падение сразу при старте
      - name: Remember start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Scrape che168 and push to bn-auto
        env:
          PYTHONIOENCODING: utf-8
          # Лог виден сразу, а не только после завершения
          PYTHONUNBUFFERED: "1"
          BN_AUTO_URL: ${{ secrets.BN_AUTO_URL }}
          BN_AUTO_IMPORT_TOKEN: ${{ secrets.BN_AUTO_IMPORT_TOKEN }}
          # che168 пускает и IP GitHub; прокси включается CHE168_USE_PROXY=1
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # Китайский прокси для che168 (необязательно): при нём объявления открываются через Китай
          CHE168_PROXY_SERVER: ${{ secrets.CHE168_PROXY_SERVER }}
          CHE168_PROXY_USERNAME: ${{ secrets.CHE168_PROXY_USERNAME }}
          CHE168_PROXY_PASSWORD: ${{ secrets.CHE168_PROXY_PASSWORD }}
          # 0 — само: до заполнения каталога по 1000 за прогон без остановки, потом 2 раза в неделю
          CHE168_TOTAL: ${{ inputs.total || '0' }}
          CHE168_SCAN_MINUTES: ${{ inputs.minutes || '90' }}
        run: python che168_scraper.py
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: che168-debug
          path: |
            che168_debug
            che168_batch.json
          retention-days: 14
          if-no-files-found: ignore
      # Мощность, найденная на Autohome и drom.ru, — чтобы в следующий раз не спрашивать
      - name: Save power cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in autohome_cache.json autohome_options.json drom_cache.json; do [ -f "$f" ] && git add -f "$f"; done
          git commit -m "chore: кэш мощности и оборудования (Autohome, drom.ru) [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1

      - name: Next fill run
        # Следующий прогон — и после ошибки (сайт не ответил, сбой), иначе цепочка стоит до
        # расписания. Но если прогон упал раньше 20 минут — ошибка при старте, её перезапуск
        # ничего не даст: ждём расписания, чтобы не крутить падения по кругу.
        if: ${{ !cancelled() && hashFiles('continue_fill') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_STARTED:-0} ))
          if [ "$JOB_STATUS" != "success" ] && [ "$elapsed" -lt 1200 ]; then
            echo "Прогон упал через $((elapsed / 60)) мин — следующий не запускаем, ждём расписания"
            exit 0
          fi
          gh workflow run che168-scrape.yml --ref main -R ${{ github.repository }}
